name: Android APK
# 1.6.0: static landing screen; test builds continue when release signing Secrets are absent.

on:
  push:
    branches: [main, native-android-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      # Keep test APK builds available even when private release Secrets have not
      # been configured. Only the signed release upload is conditional.
      - name: Detect permanent release signing key
        id: signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_SIGNING_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Permanent release signing Secrets are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release signing Secrets not configured::The installable side-by-side debug APK will still be built. The permanent release APK will not be produced until both Repository Secrets are configured."
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Build debug and release APKs
        run: gradle --no-daemon clean :app:assembleDebug :app:assembleRelease

      - name: Decode and verify permanent release key
        if: github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aimode-upload.p12"
          test -s "$RUNNER_TEMP/aimode-upload.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/aimode-upload.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=aimode-upload" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PERSISTENT=true" >> "$GITHUB_ENV"
          ACTUAL_FINGERPRINT="$(keytool -list -v -alias aimode-upload -keystore "$RUNNER_TEMP/aimode-upload.p12" -storetype PKCS12 -storepass "$ANDROID_SIGNING_PASSWORD" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':')"
          EXPECTED_FINGERPRINT="0EE2BA96CFB6CD0964C3C2AAA75877D7A5C8F8B28C7499E524C69490931F8C24"
          if [ "${ACTUAL_FINGERPRINT^^}" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error title=Unexpected signing certificate::The provided keystore does not match the AI Mode permanent upload key."
            exit 1
          fi
          echo "Permanent upload certificate verified."

      - name: Sign release with APK Signature Schemes V1–V4
        if: github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        run: |
          bash scripts/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK for pull request testing only
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ai-mode-debug-pr-test-only
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload debug APK for side-by-side testing
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ai-mode-1.6.0-debug-side-by-side-test-only
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk

      - name: Explain release signing handoff when Secrets are missing
        if: github.event_name != 'pull_request' && steps.signing.outputs.available != 'true'
        shell: bash
        run: |
          {
            echo "### Test APK created; permanent release signing still needs setup"
            echo
            echo "The side-by-side debug APK is installable for testing. No release APK was signed or published."
            echo
            echo "Add both Repository Secrets: ANDROID_KEYSTORE_BASE64 and ANDROID_SIGNING_PASSWORD. Then run this workflow again for the V1/V2/V3/V4 signed release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload permanently signed release APK and V4 signature
        if: github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-mode-release-permanent-v1-v2-v3-v4
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.idsig
