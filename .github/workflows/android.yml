name: Android APK

on:
  push:
    branches: [main, native-android-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      # Detect the secrets without failing the entire build. When they are absent,
      # upload the unsigned release APK so it can be signed with the owner's key
      # outside the public repository.
      - name: Check permanent release signing secrets
        id: signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -n "$ANDROID_SIGNING_PASSWORD" ]] || missing+=("ANDROID_SIGNING_PASSWORD")
          if (("${#missing[@]}" > 0)); then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Permanent release signing secrets missing::Missing Actions secret(s): ${missing[*]}. The build will continue and upload an unsigned release APK for signing with the owner's private key."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Both permanent signing secrets are available."
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Build debug and release APKs
        run: gradle --no-daemon clean :app:assembleDebug :app:assembleRelease

      - name: Decode and verify permanent release key
        if: github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aimode-upload.p12"
          test -s "$RUNNER_TEMP/aimode-upload.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/aimode-upload.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=aimode-upload" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PERSISTENT=true" >> "$GITHUB_ENV"
          ACTUAL_FINGERPRINT="$(keytool -list -v -alias aimode-upload -keystore "$RUNNER_TEMP/aimode-upload.p12" -storetype PKCS12 -storepass "$ANDROID_SIGNING_PASSWORD" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':')"
          EXPECTED_FINGERPRINT="C410FDCA235C0DD4501B097339F002CB6E6CC882FC51C35FC436CD888E671580"
          if [ "${ACTUAL_FINGERPRINT^^}" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error title=Unexpected signing certificate::The provided keystore does not match the AI Mode permanent upload key."
            exit 1
          fi
          echo "Permanent upload certificate verified."

      - name: Sign release with APK Signature Schemes V1–V4
        if: github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        run: |
          bash scripts/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK for pull request testing only
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ai-mode-debug-pr-test-only
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk

      - name: Package apksigner for private signing
        if: github.event_name != 'pull_request' && steps.signing.outputs.available != 'true'
        run: |
          set -euo pipefail
          TOOL_SOURCE="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          test -x "$TOOL_SOURCE/apksigner"
          mkdir -p "$RUNNER_TEMP/apksigner-tools"
          cp "$TOOL_SOURCE/apksigner" "$RUNNER_TEMP/apksigner-tools/"
          cp -R "$TOOL_SOURCE/lib" "$RUNNER_TEMP/apksigner-tools/"
          chmod +x "$RUNNER_TEMP/apksigner-tools/apksigner"
          (cd "$RUNNER_TEMP/apksigner-tools" && zip -qr "$GITHUB_WORKSPACE/app/build/outputs/apk/release/apksigner-tools.zip" apksigner lib)

      - name: Upload unsigned release APK for private signing
        if: github.event_name != 'pull_request' && steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-mode-release-unsigned-needs-private-signing
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/apksigner-tools.zip
          retention-days: 3

      - name: Upload permanently signed release APK and V4 signature
        if: github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-mode-release-permanent-v1-v2-v3-v4
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.idsig
