name: Android APK

on:
  push:
    branches: [main, native-android-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and sign Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
      HAS_RELEASE_KEY: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_SIGNING_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Build debug and release APKs
        run: gradle --no-daemon clean :app:assembleDebug :app:assembleRelease

      # Preferred path: use the owner's permanent upload key stored in Actions Secrets.
      - name: Decode permanent release key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aimode-upload.p12"
          test -s "$RUNNER_TEMP/aimode-upload.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/aimode-upload.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=aimode-upload" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PERSISTENT=true" >> "$GITHUB_ENV"

      # Fallback path: still produces a valid installable signed APK now.
      # This generated key is intentionally one-time and is NOT suitable for
      # installing future updates over this APK. Configure the two Secrets
      # above to switch permanently to the stable owner key.
      - name: Generate one-time release key when permanent key is not configured
        if: github.event_name != 'pull_request' && env.HAS_RELEASE_KEY != 'true'
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/aimode-one-time.p12"
          SIGNING_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt \
            -alias aimode-upload \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storetype PKCS12 \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$SIGNING_PASSWORD" -keypass "$SIGNING_PASSWORD" \
            -dname "CN=AI Mode One-Time Release, O=AI Mode, C=BR"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=aimode-upload" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PERSISTENT=false" >> "$GITHUB_ENV"
          echo "::warning title=One-time signing key::This APK is signed and installable, but future updates cannot use this temporary key. Configure repository Secrets to use the permanent key."

      - name: Sign release with APK Signature Schemes V1–V4
        if: github.event_name != 'pull_request'
        run: |
          bash scripts/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK for pull request testing only
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ai-mode-debug-pr-test-only
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload permanently signed release APK and V4 signature
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-mode-release-permanent-v1-v2-v3-v4
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.idsig

      - name: Upload one-time signed release APK and V4 signature
        if: github.event_name != 'pull_request' && env.HAS_RELEASE_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-mode-release-one-time-v1-v2-v3-v4
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.idsig
